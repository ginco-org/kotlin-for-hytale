name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and verify carrier jar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      # The jar's entire job is carrying the Kotlin runtime for the whole
      # server: verify the bundle actually contains it, not just that Gradle
      # exited 0. Same checks as the kotlin-bump workflow (scripts/verify_jar.py).
      - name: Build and inspect jar
        run: |
          ./gradlew jar
          python3 scripts/verify_jar.py
