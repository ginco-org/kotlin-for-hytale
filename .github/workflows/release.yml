name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  github-release:
    name: Attach carrier jar to GitHub Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v6
      # No Maven Central publication by design: consumers compile against
      # stdlib/reflect/coroutines straight from Central; this artifact is
      # strictly the runtime carrier jar for servers.
      - name: Build jar
        run: |
          ./gradlew jar
          python3 scripts/verify_jar.py
      - name: Create release with carrier jar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            build/libs/kotlin-for-hytale-*.jar \
            --title "kotlin-for-hytale $VERSION" \
            --generate-notes
