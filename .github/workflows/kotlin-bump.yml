name: Kotlin bump

# Keeps the carrier in lockstep with new stable Kotlin releases: bumps
# kotlin("jvm"), kotlin-reflect, kotlinx-coroutines, the `+kotlin.` version
# suffix and the Plugin.kt log literals (scripts/bump_kotlin.py), verifies
# the jar still bundles the runtime, then opens a PR for a human to merge
# and tag.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC, off the top of the hour
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: kotlin-bump
  cancel-in-progress: false

jobs:
  bump:
    name: Bump Kotlin runtime and open PR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compute and apply bump
        id: bump
        run: python3 scripts/bump_kotlin.py >> "$GITHUB_OUTPUT"
      - name: Verify bumped carrier jar
        if: steps.bump.outputs.changed == 'true'
        run: |
          ./gradlew jar
          python3 scripts/verify_jar.py
      - name: Open update PR
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KOTLIN: ${{ steps.bump.outputs.kotlin }}
          COROUTINES: ${{ steps.bump.outputs.coroutines }}
        run: |
          BRANCH="deps/kotlin-runtime"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add build.gradle.kts src/main/kotlin/gg/ginco/kotlinforhytale/Plugin.kt
          git commit -m "chore(deps): Kotlin ${KOTLIN} (coroutines ${COROUTINES})"
          git push -f origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --json number -q 'length')" = "0" ]; then
            BODY=$(printf '%s\n\n- Kotlin runtime (kotlin("jvm"), stdlib, reflect): %s\n- kotlinx-coroutines: %s\n\nThe +kotlin. version suffix and the Plugin.kt log literals are updated by scripts/bump_kotlin.py; the jar passed the bundle verification.\n\nMerge, then tag a new carrier release (v0.1.x) to publish via the release workflow.' "${KOTLIN}" "${COROUTINES}")
            gh pr create --base main --head "$BRANCH" \
              --title "chore(deps): Kotlin ${KOTLIN} (coroutines ${COROUTINES})" \
              --body "$BODY"
          else
            echo "PR already exists for $BRANCH — force-push updated it"
          fi
